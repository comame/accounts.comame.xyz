<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Signin</h1>
    <ul>
      <li>
        <a
          href="/authenticate?client_id=demo.accounts.comame.dev&redirect_uri=$HOST%2Fdev%2Fcallback.html&scope=openid&response_type=id_token&state=hoge&nonce=nonce"
          >Implicit Flow</a
        >
      </li>
      <li>
        <a
          href="/authenticate?client_id=demo.accounts.comame.dev&redirect_uri=$HOST%2Fdev%2Fcallback.html&scope=openid+email+profile&response_type=code&state=hoge&nonce=nonce"
          >Code Flow</a
        >
      </li>
    </ul>
    <h1>Discovery</h1>
    <ul>
      <li>
        <a href="/.well-known/openid-configuration"
          >/.well-known/openid-configuration</a
        >
      </li>
      <li><a href="/certs">/certs</a></li>
    </ul>
    <h1>Passkey</h1>
    <ul>
      <li><a href="/dev/passkey.html">Passkey</a></li>
    </ul>

    <script>
      const elements = document.querySelectorAll("a[href]");
      for (const element of elements) {
        element.href = element.href.replace(
          "$HOST",
          encodeURIComponent(location.origin)
        );
      }
    </script>
  </body>
</html>
